<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 5px;
            font-family: Arial, sans-serif;
            background-color: #2b82eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .header {
            margin-top: 5px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .start-btn {
            margin: 5px 0;
            padding: 6px 12px;
            background-color: #f59e0b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        #praise-banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 28px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 2000;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
        }
        #praise-banner.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 3px;
            width: 300px;
            height: 300px;
            background-color: #1b498c;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-top: 5px;
            position: relative;
        }
        .cell {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
        }
        .cell.filled {
            background-color: #3182ce;
            box-shadow: inset 0 0 6px rgba(255,255,255,0.4);
        }
        .cell.preview-valid {
            background-color: rgba(255, 255, 255, 0.45) !important;
            border: 2px dashed #ffffff;
        }
        .cell.preview-invalid {
            background-color: rgba(239, 68, 68, 0.4) !important;
        }

        .cell.clearing {
            animation: explodeCell 0.4s ease-out forwards;
        }
        @keyframes explodeCell {
            0% { transform: scale(1); background-color: #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }
            50% { transform: scale(1.3); background-color: #f56565; }
            100% { transform: scale(0); background-color: rgba(255,255,255,0.08); }
        }

        /* Khung chứa 3 khối thu nhỏ gọn gàng ở dưới */
        .shapes-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 300px;
            height: 90px;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 5px;
        }
        .shape-slot {
            width: 85px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shape {
            display: grid;
            gap: 2px;
            cursor: grab;
            touch-action: none;
        }
        .shape-block {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
        }
        .block-yellow { background-color: #ecc94b; }
        .block-green { background-color: #48bb78; }
        .block-red { background-color: #f56565; }
        .block-purple { background-color: #9f7aea; }
    </style>
</head>
<body>

    <div class="header">Điểm: <span id="score">0</span></div>
    <button class="start-btn" id="startBtn" onclick="startGame()">▶ Chạm để Bật âm thanh</button>

    <div id="praise-banner">Tuyệt vời!</div>

    <div class="board" id="board"></div>

    <div class="shapes-container" id="shapes-container">
        <div class="shape-slot" id="slot-0"></div>
        <div class="shape-slot" id="slot-1"></div>
        <div class="shape-slot" id="slot-2"></div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let audioCtx = null;

        const praises = ["🌟 Quá đỉnh!", "🔥 Tuyệt vời!", "🚀 Xuất sắc!", "💎 Siêu sao!", "🎉 Combo hoàn hảo!"];

        function startGame() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('startBtn').style.display = 'none';
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'place') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'clear') {
                let now = audioCtx.currentTime;
                [400, 600, 800, 1050].forEach((freq, index) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + index * 0.08);
                    g.gain.setValueAtTime(0.3, now + index * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + index * 0.08 + 0.15);
                    o.start(now + index * 0.08);
                    o.stop(now + index * 0.08 + 0.15);
                });
            }
        }

        function showPraise() {
            const banner = document.getElementById('praise-banner');
            banner.innerText = praises[Math.floor(Math.random() * praises.length)];
            banner.classList.add('show');
            setTimeout(() => banner.classList.remove('show'), 900);
        }

        const SHAPES = [
            { matrix: [[1]], color: 'block-yellow' },
            { matrix: [[1, 1]], color: 'block-green' },
