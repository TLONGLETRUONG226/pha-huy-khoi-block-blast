<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #2b82eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        .header {
            margin-top: 15px;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 340px;
            height: 340px;
            background-color: #1b498c;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-top: 15px;
            position: relative;
        }
        .cell {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            transition: background-color 0.1s ease;
        }
        .cell.filled {
            background-color: #3182ce;
            box-shadow: inset 0 0 6px rgba(255,255,255,0.4);
        }

        /* Hoạt ảnh dự đoán vị trí đặt (Preview Ghost) */
        .cell.preview-valid {
            background-color: rgba(255, 255, 255, 0.45) !important;
            border: 2px dashed #ffffff;
            transform: scale(0.95);
        }
        .cell.preview-invalid {
            background-color: rgba(239, 68, 68, 0.4) !important;
        }

        /* Hoạt ảnh biến mất khi phá hủy hàng/cột */
        .cell.clearing {
            animation: clearPop 0.3s forwards;
        }

        @keyframes clearPop {
            0% { transform: scale(1); background-color: #f59e0b; }
            50% { transform: scale(1.2); background-color: #ef4444; }
            100% { transform: scale(0); background-color: rgba(255, 255, 255, 0.08); }
        }

        .shapes-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 340px;
            height: 110px;
            margin-top: 25px;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 5px;
        }
        .shape-slot {
            width: 95px;
            height: 95px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shape {
            display: grid;
            gap: 2px;
            cursor: grab;
            touch-action: none;
            transition: transform 0.1s ease;
        }
        .shape-block {
            width: 22px;
            height: 22px;
            border-radius: 3px;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
        }
        .block-yellow { background-color: #ecc94b; }
