<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #2b82eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .header {
            margin-top: 10px;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .start-btn {
            margin-top: 8px;
            padding: 6px 14px;
            background-color: #f59e0b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        
        /* Bảng lời khen nổi giữa màn hình */
        #praise-banner {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 32px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 2000;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
        }
        #praise-banner.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 320px;
            height: 320px;
            background-color: #1b498c;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            margin-top: 10px;
            position: relative;
        }
        .cell {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }
        .cell.filled {
            background-color: #3182ce;
            box-shadow: inset 0 0 6px rgba(255,255,255,0.4);
        }
        .cell.preview-valid {
            background-color: rgba(255, 255, 255, 0.45) !important;
            border: 2px dashed #ffffff;
        }
        .cell.preview-invalid {
            background-color: rgba(239, 68, 68, 0.4) !important;
        }

        /* Hiệu ứng nổ tung khi phá hủy hàng/cột */
        .cell.clearing {
            animation: explodeCell 0.4s ease-out forwards;
        }
        @keyframes explodeCell {
            0% { transform: scale(1); background-color: #ffeb3b; box-shadow: 0 0 10px #ffeb3b; }
            50% { transform: scale(1.3); background-color: #f56565; }
            100% { transform: scale(0); background-color: rgba(255,255,255,0.08); }
        }

        .shapes-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 320px;
            height: 100px;
            margin-top: 15px;
            background-color: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 5px;
        }
        .shape-slot {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shape {
            display: grid;
            gap: 2px;
            cursor: grab;
            touch-action: none;
        }
        .shape-block {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
        }
        .block-yellow { background-color: #ecc94b; }
        .block-green { background-color: #48bb78; }
        .block-red { background-color: #f56565; }
        .block-purple { background-color: #9f7aea; }
    </style>
</head>
<body>

    <div class="header">Điểm: <span id="score">0</span></div>
    <button class="start-btn" id="startBtn" onclick="startGame()">▶ Chạm để Bật âm thanh</button>

    <!-- Khung hiển thị lời khen -->
    <div id="praise-banner">Tuyệt vời!</div>

    <div class="board" id="board"></div>

    <div class="shapes-container" id="shapes-container">
        <div class="shape-slot" id="slot-0"></div>
        <div class="shape-slot" id="slot-1"></div>
        <div class="shape-slot" id="slot-2"></div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let audioCtx = null;

            "🌟 Quá đỉnh!", 
            "🔥 Tuyệt vời!", 
            "🚀 Xuất sắc!", 
            "💎 Siêu sao!", 
            "🎉 Combo hoàn hảo!"
        ];

        function startGame() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('startBtn').style.display = 'none';
        }

        // Âm thanh sinh động qua Web Audio API
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'place') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
